glob_matcher: doublestar

pre-commit:
  jobs:
    - name: format
      glob: "**/*.dart"
      exclude:
        - "packages/**"
      run: dart format {staged_files}
      stage_fixed: true

    - name: translations
      glob: "**/*.arb"
      run: make translations
      stage_fixed: true

    - name: analyze
      glob: "**/*.{dart,yaml,arb}"
      run: flutter analyze

    - name: test
      glob: "**/*.{dart,yaml,arb}"
      run: flutter test
